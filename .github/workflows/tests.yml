name: Source tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: host/requirements.txt
      - run: python -m pip install -r host/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_public.py --output /tmp/source-only.zip
      - run: python scripts/check_public_tree.py
